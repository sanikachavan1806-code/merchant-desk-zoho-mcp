[project]
name = "zoho-merchantops-mcp"
version = "0.1.0"
description = "Read-only, agent-shaped Zoho Inventory MCP for Razorpay merchant operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.12,<2",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "cryptography>=43",
  "uvicorn>=0.30",
  "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[project.scripts]
merchantops = "merchantops.server:main"
merchantops-demo = "merchantops.demo.runner:main"
merchantops-auth = "merchantops.auth.cli:main"
merchantops-desk = "merchantops.web.cli:main"
merchantops-smoke = "merchantops.demo.smoke:main"

[tool.setuptools.package-data]
"merchantops.web" = ["static/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
